# 物品管理系统 · 数据文件
# 说明：cm 坐标（物品 pos 为中心点）；形状自带比例，size 为长边
# 迁移自：物品备份_2026-03-25.json（原系统 v1.0）

[meta]
version = 2

# ═══ 维度定义（驱动 TUI 列与校验）═══

[[dimension]]
key = "location"
name = "位置"
kind = "tree"

[[dimension]]
key = "category"
name = "分类"
kind = "enum"
values = ["电子类", "厨具", "调料", "文具", "书纸类", "食品类", "药品", "物品清洁类", "衣物类", "工具类", "历史物", "有用的小物件", "睡眠类", "驱蚊类", "雨类", "装东西类", "个人卫生类", "其他"]

[[dimension]]
key = "status"
name = "去向"
kind = "enum"
values = ["在位", "带走", "借出"]

[[dimension]]
key = "condition"
name = "状态"
kind = "enum"
values = ["正常", "待补充", "待维护"]

